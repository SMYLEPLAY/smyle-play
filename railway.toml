[build]
builder = "nixpacks"

[deploy]
# Uvicorn ASGI — FastAPI (watt-api/app) sert TOUT : l'API, les pages HTML et
# les statiques (app/routers/pages.py). Flask est supprimé depuis le 2026-07-30
# (P0-c « Sortie Flask »). Le Procfile à la racine porte la même commande :
# c'est un doublon documenté, ce fichier prime sur Railway.
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2 --access-log"

# Pré-deploy : applique les migrations Alembic avant de booter le process.
# La base suit la chaîne de migrations de watt-api/alembic/versions/ (0084 au
# 2026-09-02 ; la tête attendue par le code servi est exposée par
# GET /health → "alembic_head"). Toujours lancer alembic depuis watt-api/ :
# c'est le seul backend, l'ancien smyleplay-api a été retiré du dépôt.
preDeployCommand = "cd watt-api && alembic upgrade head"

# /health vérifie la base (SELECT 1 borné à 3 s) et renvoie 503 si elle est
# injoignable → Railway garde alors l'ancien build (L-04, 2026-09-02).
healthcheckPath = "/health"
healthcheckTimeout = 30

# Lot E (2026-10-09) : redémarrage TOUJOURS. Avec "on_failure" + 3 essais,
# un process qui plantait une 4e fois (ou qui s'arrêtait avec un code 0)
# restait ARRÊTÉ jusqu'à une intervention manuelle — site coupé la nuit.
# (restartPolicyMaxRetries ne s'applique qu'à on_failure : retiré.)
restartPolicyType = "always"

