name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PG_USER: ci
  PG_PASSWORD: ci
  PG_DB: watt_ci

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1 — Migrations Alembic sur Postgres vierge
  # Bloque un merge si une migration est cassée (chaînage, schéma, seeds).
  # ─────────────────────────────────────────────────────────────────────────────
  migrations:
    name: Alembic upgrade head (fresh Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: watt_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/watt_ci

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -U ci -d watt_ci && exit 0
            sleep 1
          done
          echo "Postgres not ready"; exit 1

      - name: Alembic upgrade head
        working-directory: watt-api
        run: alembic upgrade head

      - name: Dump final schema state
        working-directory: watt-api
        run: |
          alembic current
          alembic history | head -40

      - name: Verify key tables exist
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d watt_ci -c "\dt" \
            | tee /tmp/tables.txt
          for table in users tracks transactions; do
            grep -q " $table " /tmp/tables.txt || { echo "Missing table: $table"; exit 1; }
          done

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2 — Smoke test : l'app démarre et /health répond 200
  # Attrape une configuration cassée ou un import manquant avant prod.
  # ─────────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke test (/health)
    needs: migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: watt_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/watt_ci
      SECRET_KEY: ci-flask-secret
      JWT_SECRET: ci-jwt-secret
      ENVIRONMENT: test
      PORT: "8000"
      CORS_ALLOWED_ORIGINS: "*"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        working-directory: watt-api
        run: alembic upgrade head

      - name: Start API
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &
          echo $! > /tmp/uvicorn.pid

      - name: Wait for /health
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:8000/health > /tmp/health.json; then
              echo "OK: /health responded"
              cat /tmp/health.json || true
              exit 0
            fi
            sleep 1
          done
          echo "FAIL: /health never responded"
          echo "--- uvicorn log ---"
          cat /tmp/uvicorn.log
          exit 1

      - name: Stop API
        if: always()
        run: |
          [ -f /tmp/uvicorn.pid ] && kill "$(cat /tmp/uvicorn.pid)" || true

      - name: Upload uvicorn log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uvicorn-log
          path: /tmp/uvicorn.log

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3 — Suite pytest sur Postgres réel
  # C'EST LE FILET MANQUANT : jusqu'ici la CI lançait les migrations + un smoke
  # /health, mais JAMAIS les tests comportementaux. Les bugs passaient donc en
  # prod sans être vus. Ce job exécute toute la suite tests/ contre un vrai
  # Postgres (le même moteur qu'en prod), et bloque le merge si rouge.
  # ─────────────────────────────────────────────────────────────────────────────
  tests:
    name: Pytest (Postgres réel)
    needs: migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: watt_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/watt_ci
      SECRET_KEY: ci-flask-secret
      JWT_SECRET: ci-jwt-secret
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Install dependencies (+ test tooling)
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-github-actions-annotate-failures

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -U ci -d watt_ci && exit 0
            sleep 1
          done
          echo "Postgres not ready"; exit 1

      - name: Apply migrations
        working-directory: watt-api
        run: alembic upgrade head

      - name: Run pytest suite
        working-directory: watt-api
        run: |
          set -o pipefail
          # -rf : liste les tests FAILED en fin de sortie. On copie le tout
          # dans le récapitulatif du run (visible sur la page GitHub sans
          # connexion) → diagnostic rapide des échecs sans ouvrir les logs.
          {
            echo '### Résultat pytest'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          pytest -q -rf 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4 — Sécurité : dépendances (pip-audit), code (bandit), secrets (gitleaks)
  # Pré-requis "argent inviolable" du durcissement (H0.1a). Bloquant : un merge
  # échoue si une dépendance vulnérable, un défaut de code medium+ ou un secret
  # est introduit. Calibré 2026-06-25 sur l'état propre du repo :
  #   • pip-audit : 0 vulnérabilité connue ;
  #   • bandit -ll -ii : 0 défaut medium+ (les Low B105/B110 ne bloquent pas) ;
  #   • gitleaks --no-git : 0 secret dans les fichiers (scan de l'état du disque,
  #     pas de l'historique → une fuite passée ne fige pas les PR, mais tout
  #     secret AJOUTÉ dans une PR est bloqué).
  # ─────────────────────────────────────────────────────────────────────────────
  security:
    name: Sécurité (pip-audit · bandit · gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scanners
        run: pip install pip-audit bandit

      - name: pip-audit (dépendances vulnérables)
        run: |
          set -o pipefail
          {
            echo '### pip-audit'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          pip-audit -r requirements.txt --progress-spinner off 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: bandit (défauts de code medium+)
        run: |
          set -o pipefail
          {
            echo '### bandit (medium+)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # -ll : seuil de sévérité medium+ ; -ii : confiance medium+.
          # Bloque (exit ≠ 0) seulement sur un défaut medium+/medium+.
          bandit -r watt-api/app -ll -ii 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: gitleaks (secrets dans les fichiers)
        run: |
          set -euo pipefail
          VER="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar xz gitleaks
          # --no-git : scanne l'état du disque (fichiers présents), pas l'historique.
          # L'arbre suivi est propre (vérifié 2026-06-25) ; tout secret introduit
          # dans une PR apparaît dans les fichiers et fait échouer ce job.
          # `detect` = forme stable sur tout gitleaks v8 ; exit 1 par défaut si fuite.
          ./gitleaks detect --source . --no-git --no-banner --redact
