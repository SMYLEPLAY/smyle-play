name: E2E smoke (Playwright)

# Filet anti-régression front (H0.1b du durcissement). Premier maillon avant
# la découpe des monolithes et le Monde Visuel : on démarre l'app prod unifiée
# (`uvicorn main:app` = FastAPI seul, qui sert l'API, les pages et les
# statiques — Flask et a2wsgi ont été supprimés le 2026-07-30, P0-c) et on
# vérifie que la vitrine se charge et que le catalogue répond.
#
# Workflow SÉPARÉ de ci.yml exprès : pas de conflit de fichier avec les PR qui
# touchent ci.yml, et un parcours front peut évoluer sans rouvrir le CI cœur.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'agent/**']
  workflow_dispatch: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  smoke:
    name: Smoke storefront (Playwright) — ${{ matrix.config }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Deux variantes du MÊME job (moins coûteux qu'un job dupliqué) :
    #   - actuelle : interrupteurs par défaut (ce qui tourne en prod aujourd'hui) ;
    #   - jour-j   : TOUS les interrupteurs du lancement du 1er novembre allumés
    #                (cf. étape « Configuration jour J »). Si elle est rouge, le
    #                lancement casse quelque chose : ne pas basculer en prod.
    strategy:
      fail-fast: false
      matrix:
        config: [actuelle, jour-j]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: smyleplay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/smyleplay_ci
      SECRET_KEY: ci-test-key-not-a-secret-xxxxxxxxxxxxxxxxxxxxxxxx
      ENVIRONMENT: test
      PORT: "8000"
      CORS_ALLOWED_ORIGINS: "*"
      E2E_BASE_URL: http://localhost:8000
      # MODE LANCEMENT : par defaut tout est masque (MODE_LANCEMENT=True).
      # L'E2E teste la page /offres (3 paliers) → on rallume l'item, sinon
      # la route repond 302 → accueil et le test echoue (title mismatch).
      SHOW_PALIERS: "True"

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Apply migrations
        # Phase 2 lancement (2026-07-24) : l'E2E migrait depuis smyleplay-api
        # (schéma figé à 0070) puis démarrait main:app = watt-api (attend 0081)
        # → l'app bootait sur un schéma périmé. On rebranche sur watt-api, ce
        # qui aligne l'E2E sur la prod et permet de supprimer smyleplay-api.
        working-directory: watt-api
        run: alembic upgrade head

      - name: Configuration jour J (interrupteurs du 1er novembre)
        if: matrix.config == 'jour-j'
        run: |
          {
            echo "REQUIRE_EMAIL_VERIFIED=true"
            echo "FEATURE_PIONEER=true"
            echo "FEATURE_MARKET_SMYLES=true"
            echo "MODE_LANCEMENT=true"
            echo "FEATURE_GOAL=true"
            echo "FEATURE_QUETES_PARRAINAGE=true"
            echo "FEATURE_SELL_GATE=true"
            echo "SELL_GATE_DEPUIS=2026-11-01"
            echo "E2E_JOUR_J=1"
          } >> "$GITHUB_ENV"

      - name: Fixture jour J (comptes de test vérifiés, base CI uniquement)
        if: matrix.config == 'jour-j'
        # Pas de boîte mail en CI : les comptes « e2e-… » sont marqués vérifiés
        # à la création (sauf « e2e-nonverifie-… »). Base éphémère seulement.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f e2e/fixtures/jour-j.sql

      - name: Start app (FastAPI — API + front)
        run: |
          # Entrée prod : FastAPI sert l'API, les pages et les statiques.
          uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &
          echo $! > /tmp/uvicorn.pid

      - name: Wait for /health
        run: |
          for i in {1..40}; do
            if curl -fs http://localhost:8000/health > /dev/null; then
              echo "OK: app up"; exit 0
            fi
            sleep 1
          done
          echo "FAIL: app never came up"; echo "--- uvicorn log ---"; cat /tmp/uvicorn.log; exit 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install Playwright (+ chromium)
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: e2e
        run: npx playwright test

      - name: Stop app
        if: always()
        run: |
          [ -f /tmp/uvicorn.pid ] && kill "$(cat /tmp/uvicorn.pid)" || true

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.config }}
          path: |
            e2e/playwright-report
            /tmp/uvicorn.log
          if-no-files-found: ignore
