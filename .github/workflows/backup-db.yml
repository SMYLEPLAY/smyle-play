# ─────────────────────────────────────────────────────────────────────────────
# Backup quotidien de la base Postgres (Railway) vers Cloudflare R2.
#
# Pourquoi : les backups natifs Railway exigent le plan Pro et le PITR n'est
# pas restaurable hors Pro (constat 2026-06-11). Ce workflow est donc le
# FILET PRINCIPAL : dump complet chaque nuit + déclenchement manuel.
#
# Bucket : smyleplay-db-backups-watt — bucket R2 PRIVÉ et SÉPARÉ du bucket audio
# public. Ne JAMAIS pointer vers smyle-play-audio (les dumps contiennent
# emails + hash de mots de passe).
#
# Secrets GitHub requis (Settings → Secrets and variables → Actions) :
#   BACKUP_DATABASE_URL  → DATABASE_PUBLIC_URL du service Postgres Railway
#   R2_ACCESS_KEY_ID     → token R2 scopé sur le bucket backups uniquement
#   R2_SECRET_ACCESS_KEY → idem
#
# Rotation : 14 jours glissants (≈ 14 dumps), purge automatique en fin de run.
# Restauration (jour J, guidée) :
#   gunzip -c smyleplay_<date>.sql.gz | psql "<DATABASE_URL d'une base neuve>"
# ─────────────────────────────────────────────────────────────────────────────
name: Backup DB quotidien (pg_dump vers R2)

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC chaque nuit (06:00 Paris été)
  workflow_dispatch: {} # bouton "Run workflow" pour test manuel

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dump Postgres (client 18 via Docker — serveur Railway = 18.4)
        env:
          DB_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%d_%H%M)
          FILE="smyleplay_${STAMP}.sql.gz"
          docker run --rm -e PGCONNECT_TIMEOUT=20 postgres:18-alpine \
            pg_dump --no-owner --no-privileges "$DB_URL" | gzip > "$FILE"
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          ls -lh "$FILE"

      - name: Vérifier l'intégrité du dump
        run: |
          set -euo pipefail
          gunzip -t "$FILE"
          gunzip -c "$FILE" | tail -n 5 | grep -q "PostgreSQL database dump complete"
          SIZE=$(stat -c%s "$FILE")
          echo "Taille du dump : ${SIZE} octets"
          test "$SIZE" -gt 5000 # un dump réel ne peut pas être minuscule

      - name: Envoyer vers R2 (bucket privé)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 ne supporte pas les checksums automatiques d'aws cli v2.23+
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          # En dur : identifiant de compte R2, pas un secret (le secret
          # R2_ENDPOINT_URL posait des soucis de format — abandonné).
          R2_ENDPOINT: https://2376b01ec5baa2915948d63fcca6a367.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          # Nettoie espaces / retours-ligne parasites d'un collage manuel
          export AWS_ACCESS_KEY_ID="$(printf %s "$AWS_ACCESS_KEY_ID" | tr -d '[:space:]')"
          export AWS_SECRET_ACCESS_KEY="$(printf %s "$AWS_SECRET_ACCESS_KEY" | tr -d '[:space:]')"
          # Diagnostic sans rien révéler : longueurs attendues 32 et 64
          echo "aws: $(aws --version)"
          echo "Endpoint: $R2_ENDPOINT"
          echo "Longueur Access Key ID: ${#AWS_ACCESS_KEY_ID} (attendu: 32)"
          echo "Longueur Secret Key:    ${#AWS_SECRET_ACCESS_KEY} (attendu: 64)"
          # Test d'accès au bucket AVANT l'upload (erreur plus lisible)
          aws s3api head-bucket --bucket smyleplay-db-backups-watt \
            --endpoint-url "$R2_ENDPOINT"
          echo "Accès bucket : OK"
          aws s3 cp "$FILE" "s3://smyleplay-db-backups-watt/$FILE" \
            --endpoint-url "$R2_ENDPOINT"
          echo "Backup déposé : $FILE"

      - name: Rotation — supprimer les dumps de plus de 14 jours
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          # En dur : identifiant de compte R2, pas un secret (le secret
          # R2_ENDPOINT_URL posait des soucis de format — abandonné).
          R2_ENDPOINT: https://2376b01ec5baa2915948d63fcca6a367.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$(printf %s "$AWS_ACCESS_KEY_ID" | tr -d '[:space:]')"
          export AWS_SECRET_ACCESS_KEY="$(printf %s "$AWS_SECRET_ACCESS_KEY" | tr -d '[:space:]')"
          CUTOFF=$(date -u -d "14 days ago" +%Y-%m-%d)
          aws s3 ls "s3://smyleplay-db-backups-watt/" --endpoint-url "$R2_ENDPOINT" \
            | awk '{print $NF}' | while read -r f; do
              d=$(echo "$f" | sed -nE 's/^smyleplay_([0-9]{4}-[0-9]{2}-[0-9]{2})_.*/\1/p')
              if [ -n "$d" ] && [ "$d" \< "$CUTOFF" ]; then
                echo "Purge : $f (antérieur au $CUTOFF)"
                aws s3 rm "s3://smyleplay-db-backups-watt/$f" --endpoint-url "$R2_ENDPOINT"
              fi
            done
          echo "Rotation terminée."
