[pytest]
# Configuration pytest-asyncio 1.x — TOUS les tests et fixtures async
# partagent le MÊME event loop scoped à la session.
#
# Sans ces options, pytest-asyncio crée un event loop par test, mais
# l'engine SQLAlchemy/asyncpg de app.database est bound au loop d'import.
# Résultat : "cannot perform operation: another operation is in progress"
# dès qu'un test partage SessionLocal avec un autre.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
# Les TESTS doivent tourner sur la MÊME boucle que les fixtures session-scoped,
# sinon : "got Future attached to a different loop" (le moteur asyncpg est lié à
# la boucle de la fixture, le test à une autre). Aligne test ↔ fixture.
asyncio_default_test_loop_scope = session

# S-09 (2026-09-02) — une clé de signature trop courte doit FAIRE ÉCHOUER la
# suite, pas seulement émettre un avertissement. PyJWT 2.13 lève
# InsecureKeyLengthWarning sous 32 octets (taille du bloc HS256) ; la CI
# signait avec `ci-flask-secret` (15 octets) et l'avertissement passait
# inaperçu. Seule cette catégorie est promue en erreur.
# NB : la classe vit dans `jwt.warnings`, PAS dans `jwt.exceptions` (vérifié
# sur pyjwt==2.13.0, requirements.txt:86) — un chemin erroné fait échouer
# pytest au parsing de sa configuration, avant tout test.
filterwarnings =
    error::jwt.warnings.InsecureKeyLengthWarning
